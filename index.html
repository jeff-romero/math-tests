<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Math tests</title>
        <meta charset="UTF-8"/>
        <link rel="stylesheet" type="text/css" href="assets/styles/main.css"/>
    </head>
    <body id="root">
        <div id="top">
            <div id="checkboxWrapper">
                <div>
                    <input id="showTimer" type="checkbox"/>
                    <span>Show Timer</span>
                </div>
                <div>
                    <input id="showErrors" type="checkbox">
                    <span>Show Errors</span>
                </div>
            </div>
            <button id="submit">SUBMIT</button>
            <div id="timerScoreWrapper">
                <div>
                    <span id="timer">00:00:00</span>
                </div>
                <div id="scoreWrapper">
                    <span id="score" class="scoreNum"></span>
                    <span>/</span>
                    <span id="total" class="scoreNum"></span>
                </div>
            </div>
        </div>
    </body>
    <script src="assets/scripts/main.js"></script>
</html>
